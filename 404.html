<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
        (function () {
            try {
                var t = localStorage.getItem("theme") || "dark";
                document.documentElement.setAttribute("data-theme", t);
            } catch (e) { }
        })();
    </script>
    <title>404 — Page Not Found · The Anh Tran</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/mediaqueries.css" />
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div data-include="/partials/nav.html"></div>
    <main id="main">
        <section id="profile" style="min-height: 70vh; flex-direction: column; gap: 1rem;">
            <div class="section__text">
                <p class="section__text__p1">Error 404</p>
                <h1 class="title">Page Not Found</h1>
                <div class="intro-text" style="margin: 1rem auto;">
                    The page you're looking for doesn't exist or has moved.
                    Let's get you back on track.
                </div>
                <div class="btn-container">
                    <button class="btn btn-color-2" onclick="location.href='/'">Go Home</button>
                    <button class="btn btn-color-2" onclick="location.href='/blogs.html'">Read the Blog</button>
                </div>
            </div>
        </section>
    </main>
    <div data-include="/partials/footer.html"></div>
    <script src="/js/site.js" defer></script>
</body>

</html>
