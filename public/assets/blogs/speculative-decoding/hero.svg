<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0c0e1a"/>
      <stop offset="100%" stop-color="#1a1d30"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <!-- Background (safe to crop on all sides) -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="600" cy="315" rx="300" ry="190" fill="rgba(80,120,255,0.08)"/>

  <!-- ===== Center-concentrated content (within square + wide safe zone) ===== -->

  <!-- Title -->
  <text x="600" y="252" text-anchor="middle" font-family="Poppins, Segoe UI, sans-serif"
        font-size="58" font-weight="700" fill="#f4f6ff">Speculative</text>
  <text x="600" y="316" text-anchor="middle" font-family="Poppins, Segoe UI, sans-serif"
        font-size="58" font-weight="700" fill="#f4f6ff">Decoding</text>

  <!-- Token chips: draft guesses, verified ✓✓✓✗ (narrow, centered) -->
  <g font-family="Fira Code, monospace" font-size="20" fill="#dfe6ff">
    <rect x="493" y="352" width="46" height="46" rx="9" fill="#243049" stroke="#51cf66" stroke-width="1.5"/>
    <text x="516" y="382" text-anchor="middle">t&#8321;</text>
    <rect x="549" y="352" width="46" height="46" rx="9" fill="#243049" stroke="#51cf66" stroke-width="1.5"/>
    <text x="572" y="382" text-anchor="middle">t&#8322;</text>
    <rect x="605" y="352" width="46" height="46" rx="9" fill="#243049" stroke="#51cf66" stroke-width="1.5"/>
    <text x="628" y="382" text-anchor="middle">t&#8323;</text>
    <rect x="661" y="352" width="46" height="46" rx="9" fill="#243049" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="684" y="382" text-anchor="middle">t&#8324;</text>
  </g>
  <g font-family="Poppins, sans-serif" font-size="20" font-weight="700">
    <text x="516" y="428" text-anchor="middle" fill="#51cf66">&#10003;</text>
    <text x="572" y="428" text-anchor="middle" fill="#51cf66">&#10003;</text>
    <text x="628" y="428" text-anchor="middle" fill="#51cf66">&#10003;</text>
    <text x="684" y="428" text-anchor="middle" fill="#ff6b6b">&#10007;</text>
  </g>

  <!-- Badge -->
  <rect x="437" y="456" width="326" height="48" rx="24"
        fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <text x="600" y="486" text-anchor="middle" font-family="Poppins, sans-serif" font-size="19" font-weight="600">
    <tspan fill="#ffd43b">~3&#215; faster</tspan><tspan fill="#7f88b0">  &#183;  </tspan><tspan fill="#9be8ac">zero quality loss</tspan>
  </text>
</svg>
